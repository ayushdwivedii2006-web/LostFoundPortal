<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Item | Lost & Found</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- Animated background -->

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
    <div class="glow glow-three"></div>


    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            🔎 Lost<span>&</span>Found
        </div>

        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/my-reports">
                My Reports
            </a>

            <a href="/logout">
                Logout
            </a>

        </div>

    </nav>


    <!-- Report Section -->

    <section class="report-page">

        <div class="report-box">

            <div class="report-icon">
                📦
            </div>

            <h1>
                Report an Item
            </h1>

            <p>
                Tell us about the item you lost or found.
            </p>


            <!-- IMPORTANT:
                 enctype is required for image upload -->

            <form method="POST" enctype="multipart/form-data">


                <!-- Item Type -->

                <div class="form-group">

                    <label>
                        What happened?
                    </label>

                    <select name="item_type" required>

                        <option value="">
                            Select an option
                        </option>

                        <option value="Lost">
                            🔍 I Lost Something
                        </option>

                        <option value="Found">
                            📦 I Found Something
                        </option>

                    </select>

                </div>


                <!-- Item Name -->

                <div class="form-group">

                    <label>
                        Item Name
                    </label>

                    <input type="text" name="item_name" placeholder="Example: Black Wallet" required>

                </div>


                <!-- Category -->

                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <select name="category" required>

                        <option value="">
                            Select category
                        </option>

                        <option value="Electronics">
                            📱 Electronics
                        </option>

                        <option value="Documents">
                            📄 Documents
                        </option>

                        <option value="Wallet">
                            👛 Wallet
                        </option>

                        <option value="Keys">
                            🔑 Keys
                        </option>

                        <option value="Bag">
                            🎒 Bag
                        </option>

                        <option value="Clothing">
                            👕 Clothing
                        </option>

                        <option value="Other">
                            📦 Other
                        </option>

                    </select>

                </div>


                <!-- Location -->

                <div class="form-group">

                    <label>
                        Location
                    </label>

                    <input type="text" name="location" placeholder="Where was it lost/found?" required>

                </div>


                <!-- Date -->

                <div class="form-group">

                    <label>
                        Date
                    </label>

                    <input type="date" name="item_date" required>

                </div>


                <!-- Description -->

                <div class="form-group">

                    <label>
                        Description
                    </label>

                    <textarea name="description" rows="5" placeholder="Describe the item..."></textarea>

                </div>


                <!-- ITEM PHOTO -->

                <div class="form-group">

                    <label>
                        📷 Item Photo
                    </label>

                    <input type="file" name="image" accept="image/png, image/jpeg, image/webp">

                    <small>
                        Upload JPG, PNG or WEBP image
                    </small>

                </div>


                <!-- Submit -->

                <button type="submit" class="report-btn">

                    🚀 Submit Report

                </button>


            </form>

        </div>

    </section>


</body>

</html>
